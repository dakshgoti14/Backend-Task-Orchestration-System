---
apiVersion: v1
kind: Service
metadata:
  name: btos-api-service
  namespace: btos
  labels:
    app: btos-api
spec:
  type: ClusterIP
  selector:
    app: btos-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: btos-ingress
  namespace: btos
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
    - host: btos.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: btos-api-service
                port:
                  number: 80
