apiVersion: v1
kind: ConfigMap
metadata:
  name: btos-config
  namespace: btos
data:
  NODE_ENV: "production"
  API_VERSION: "v1"
  LOG_LEVEL: "info"
  PORT: "3000"
  METRICS_PORT: "9090"
  DB_PORT: "5432"
  REDIS_PORT: "6379"
  SCHEDULER_POLL_INTERVAL_MS: "1000"
  SCHEDULER_MAX_CONCURRENT_JOBS: "100"
  WORKER_CONCURRENCY: "10"
  WORKER_MAX_RETRIES: "3"
  WORKER_RETRY_DELAY_MS: "5000"
  WORKER_JOB_TIMEOUT_MS: "300000"
  WORKER_HEARTBEAT_INTERVAL_MS: "5000"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
---
apiVersion: v1
kind: Secret
metadata:
  name: btos-secrets
  namespace: btos
type: Opaque
stringData:
  DB_HOST: "postgres-service"
  DB_NAME: "task_orchestration"
  DB_USER: "postgres"
  DB_PASSWORD: "change-me-in-production"
  REDIS_HOST: "redis-service"
  JWT_SECRET: "change-me-to-a-256-bit-secret-in-production"
